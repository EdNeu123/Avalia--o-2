<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="Indicador 02 - Desenvolvimento CSS" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <fieldset>
        <legend class="legend-border">Fale Conosco</legend>
        <div class="container-body">
            <div>
                <h3>Nome:</h3>
                <label for="name"></label>
                <input type="text" id="name">
            </div>

            <div>
                <h3>Email:</h3>
                <label for="email"></label>
                <input type="email" id="email">
            </div>

            <div>
                <h3 class="msg">Mensagem:</h3>
                <label for="Mensagem"></label>
                <textarea style="overflow-y: scroll;" name="Mensagem" id="Mensagem" cols="30" rows="5"></textarea>
            </div>

            <button class="button" type="submit">Enviar</button>
        </div>
    </fieldset>
</body>

</html>
